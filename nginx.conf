# HTTP -> HTTPS 重定向
server {
  listen 80;
  server_name www.chinaaupairs.com;
  return 301 https://$server_name$request_uri;
}

# HTTPS 服务器
server {
  listen 443 ssl http2;
  server_name www.chinaaupairs.com;
  server_tokens off;
  index index.php;
  root /var/www/www.chinaaupairs.com;

  access_log  /var/log/nginx/www.chinaaupairs.com_access.log;
  error_log   /var/log/nginx/www.chinaaupairs.com_error.log;

  # SSL 证书配置
  ssl_certificate /etc/letsencrypt/live/www.chinaaupairs.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.chinaaupairs.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

  client_max_body_size 100M;

  location / {
    try_files $uri $uri/ /index.php$request_uri;
  }

  # ===========================================
  # 后端 API 代理 (/miniprogram/api/*)
  # /miniprogram/api/articles → /api/articles
  # ===========================================
  location /miniprogram/api/ {
    rewrite ^/miniprogram/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 文件上传支持
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # ===========================================
  # 微信小程序专用接口 (/miniprogram/wechat/*)
  # /miniprogram/wechat/articles → /wechat/articles
  # ===========================================
  location /miniprogram/wechat/ {
    rewrite ^/miniprogram/wechat/(.*)$ /wechat/$1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ===========================================
  # 管理后台代理 (/miniprogram/admin/*)
  # 浏览器地址栏保持 /miniprogram/admin/*，后端收到 /admin/*
  # ===========================================
  location /miniprogram/admin/ {
    rewrite ^/miniprogram/admin(/.*)?$ /admin$1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ===========================================
  # 上传文件代理 (/miniprogram/uploads/*)
  # /miniprogram/uploads/xxx → /uploads/xxx
  # ===========================================
  location /miniprogram/uploads/ {
    rewrite ^/miniprogram/uploads/(.*)$ /uploads/$1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 缓存上传的图片
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # ===========================================
  # PHP 处理
  # ===========================================
  location ~ ^(.+\.php)(.*)$ {
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_split_path_info       ^(.+\.php)(.*)$;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;
    include fastcgi_params;
  }

}